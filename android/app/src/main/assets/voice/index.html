<!doctype html>
<html lang="ru"><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#e7ecf6;background:#090e18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 28%,#18364c 0,#172132 38%,#090e18 76%);height:100dvh;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,summary:focus-visible{outline:2px solid #8dccf0;outline-offset:4px}[hidden]{display:none!important}#voice-button,#availability,#voice-minimize,#voice-dot{display:none!important}#voice-panel{position:relative;display:flex;flex-direction:column;align-items:center;width:100%!important;height:100%!important;min-height:0;padding:clamp(16px,5vh,44px) 20px 20px}.identity{text-align:center;margin-top:clamp(0px,3vh,28px)}.avatar{width:96px;height:96px;border-radius:50%;margin:auto;display:grid;place-items:center;background:radial-gradient(circle at 32% 23%,#254b62,#163247 45%,#102333);box-shadow:0 0 70px #8dccf030,inset 0 0 0 1px #8dccf044;transition:box-shadow .3s,transform .3s}.avatar svg{width:88px;height:88px;fill:none;stroke:none}.speaking .avatar{animation:breathe 1.1s ease-in-out infinite;box-shadow:0 0 85px #8dccf07a}h1{font-size:30px;font-weight:600;margin:18px 0 5px;letter-spacing:-.7px}.caption{font-size:13px;color:#aab5c8;margin:0}.timing{text-align:center;margin-top:clamp(18px,5vh,48px)}#call-timer{display:block;font-size:38px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:1px;min-height:46px}#voice-status{color:#b8c2d5;font-size:14px;margin:10px 0;min-height:40px;max-width:300px;overflow-wrap:anywhere}.wave{height:28px;display:flex;align-items:center;justify-content:center;gap:4px;margin:0 auto 10px}.wave i{height:5px;width:4px;border-radius:4px;background:#8dccf0}.speaking .wave i{animation:wave .8s ease-in-out infinite alternate}.wave i:nth-child(2){animation-delay:.15s!important}.wave i:nth-child(3){animation-delay:.3s!important}.wave i:nth-child(4){animation-delay:.45s!important}.actions{display:flex;justify-content:space-around;align-items:start;gap:clamp(16px,6vw,40px);margin-top:auto;padding:18px 0 8px;width:100%;max-width:360px}.control{display:flex;flex-direction:column;align-items:center;gap:11px;font-size:12px;color:#b8c2d5;min-width:76px}.actions button{width:68px;height:68px;border:1px solid #ffffff16;border-radius:50%;background:#ffffff12;display:grid;place-items:center;transition:background .2s;color:#fff}.actions button svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.actions button.active{background:#e7ecf6;color:#172132}.actions #voice-hangup{background:#e9435d;border-color:#ff829633}.actions #voice-hangup svg{fill:white;stroke:none}.muted-strike{display:none}.active .muted-strike{display:block}#conversation{width:100%;max-width:480px;margin-top:18px;border-top:1px solid #ffffff0d;flex-shrink:0}summary{list-style:none;text-align:center;padding:12px;color:#aab5c8;font-size:13px;cursor:pointer}summary::-webkit-details-marker{display:none}summary::after{content:' ⌃';display:inline}details[open] summary::after{content:' ⌄'}.conversation-content{overflow:auto;max-height:28vh;padding:0 4px 8px;font-size:14px}.voice-msg{padding:10px 12px;margin:8px 0;background:#ffffff07;border-radius:14px}.voice-msg-role{display:block;color:#aab5c8;font-size:11px;margin-bottom:4px}.voice-msg-body{white-space:pre-wrap;overflow-wrap:anywhere}.voice-approval{padding:12px;background:#142b3d;border:1px solid #8dccf077;border-radius:14px}.voice-approval-actions{display:flex;gap:10px}.voice-approval button{border:1px solid #8dccf077;border-radius:18px;padding:10px;background:#18364c}.voice-task-row{font-size:12px;color:#aab5c8;margin-bottom:8px}.approval summary{color:#8dccf0}.approval summary::before{content:'● ';color:#8dccf0}@keyframes breathe{50%{transform:scale(1.035)}}@keyframes wave{to{height:23px}}@media(max-height:600px){.avatar{width:64px;height:64px}.avatar svg{width:58px;height:58px}.identity{margin-top:0}h1{font-size:24px;margin-top:10px}.timing{margin-top:12px}#call-timer{font-size:28px;min-height:32px}.actions button{width:56px;height:56px}.actions{padding-top:8px}#conversation{margin-top:4px}#voice-panel{padding-top:10px}.wave{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.actions{order:3;flex-shrink:0}#conversation{order:4}.details-open .identity{display:flex;align-items:center;gap:14px;text-align:left;margin-top:0}.details-open .avatar{width:40px;height:40px}.details-open .avatar svg{width:36px;height:36px}.details-open h1{font-size:20px;margin:0}.details-open .caption,.details-open .wave{display:none}.details-open .timing{margin-top:12px}.details-open #call-timer{font-size:24px;min-height:28px}.details-open #voice-status{min-height:24px;margin:6px 0}.details-open #conversation{order:2;flex:1;min-height:0;overflow:auto;margin-top:12px}.details-open .conversation-content{max-height:none;overflow:visible}.details-open .actions{margin-top:12px}.details-open summary{position:sticky;top:0;background:#101725;z-index:1;border-radius:14px}.details-open #voice-panel{padding-top:16px}
.ptt-mode #voice-mic{touch-action:none;user-select:none;-webkit-user-select:none}.ptt-mode #voice-mic.active{background:#ffffff12;color:#b8c2d5}.ptt-mode #voice-mic.recording{background:#8dccf0;color:#102334;box-shadow:0 0 24px #8dccf055}
.voice-msg-assistant .voice-msg-body{white-space:normal;line-height:1.55}.voice-msg-body .md-heading{text-align:left;letter-spacing:normal;line-height:1.35;font-weight:650;margin:16px 0 8px}.voice-msg-body h1.md-heading{font-size:24px}.voice-msg-body h2.md-heading{font-size:20px}.voice-msg-body h3.md-heading{font-size:18px}.voice-msg-body :is(h4,h5,h6).md-heading{font-size:16px}.voice-msg-body>:first-child{margin-top:0}.voice-msg-body>:last-child{margin-bottom:0}.voice-msg-body .md-paragraph{margin:8px 0}.voice-msg-body .md-list{margin:8px 0;padding-left:24px}.voice-msg-body .md-list-item{margin:5px 0}.voice-msg-body .md-blockquote{margin:12px 0;padding:2px 12px;border-left:3px solid #8dccf0;color:#b8c2d5;background:#ffffff04}.voice-msg-body .md-link{color:#8dccf0;text-decoration:underline;text-underline-offset:3px}.voice-msg-body .md-rule{border:0;border-top:1px solid #ffffff18;margin:16px 0}.voice-msg-body .md-table{display:block;max-width:100%;width:max-content;overflow-x:auto;border-collapse:collapse;margin:12px 0;font-size:13px}.voice-msg-body :is(.md-th,.md-td){padding:9px 12px;border:1px solid #ffffff18;text-align:left;min-width:96px}.voice-msg-body .md-th{background:#ffffff09;font-weight:600}.voice-msg-body .md-code{margin:12px 0;border:1px solid #ffffff18;border-radius:12px;overflow:hidden;background:#090e18}.voice-msg-body .md-code-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;background:#ffffff07;color:#aab5c8;font-size:11px}.voice-msg-body .md-code-copy{border:1px solid #ffffff18;border-radius:8px;background:#ffffff08;padding:5px 8px;font-size:11px}.voice-msg-body .md-pre{margin:0;padding:12px;max-width:100%;overflow:auto;white-space:pre;overflow-wrap:normal;font:13px/1.55 ui-monospace,monospace}.voice-msg-body .md-code-inline{padding:2px 5px;border-radius:5px;background:#ffffff0b;font:0.94em ui-monospace,monospace}
.voice-approval-text{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body>
<button id="voice-button">Начать разговор</button><p id="availability"></p>
<section id="voice-panel" hidden>
<div id="voice-dot"></div>
<div class="identity"><div class="avatar"><svg viewBox="0 0 1280 1280" role="img" aria-label="Игорёк в наушниках">
<defs><filter id="call-octopus-blue" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0 0 0 0 .553 0 0 0 0 .8 0 0 0 0 .941 0 0 1.15 0 -.062745"/></filter></defs>
<path d="M310 530V430c0-195 135-320 330-320s330 125 330 320v100" stroke="#102334" stroke-width="100" stroke-linecap="round"/>
<path d="M310 530V430c0-195 135-320 330-320s330 125 330 320v100" stroke="#BDE5FB" stroke-width="44" stroke-linecap="round"/>
<image href="igorek-octopus.jpg" width="1280" height="1280" filter="url(#call-octopus-blue)"/>
<g fill="#18364C" stroke="#BDE5FB" stroke-width="24"><rect x="265" y="400" width="105" height="230" rx="45"/><rect x="910" y="400" width="105" height="230" rx="45"/></g>
<path d="M982 620v95q0 95-115 95h-45" stroke="#102334" stroke-width="42" stroke-linecap="round"/>
<path d="M982 620v95q0 95-115 95h-45" stroke="#BDE5FB" stroke-width="18" stroke-linecap="round"/>
<rect x="770" y="782" width="105" height="56" rx="28" fill="#BDE5FB" stroke="#102334" stroke-width="18"/>
</svg></div><h1>Игорёк</h1><p class="caption">Голосовой разговор</p></div>
<div class="timing"><time id="call-timer">Соединяем…</time><div id="voice-status" role="status" aria-live="polite"></div><div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="actions">
<div class="control"><button id="voice-speaker" aria-label="Выключить звук"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5m5 3a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="muted-strike" d="m2 2 20 20"/></svg></button><span>Звук</span></div>
<div class="control"><button id="voice-hangup" aria-label="Завершить разговор"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12c5-6 15-6 20 0v5c0 1-1 1-2 1l-4-2v-3c-3-1-5-1-8 0v3l-4 2c-1 0-2 0-2-1z"/></svg></button><span>Завершить</span></div>
<div class="control"><button id="voice-mic" aria-label="Выключить микрофон"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2m-7 9v3m-4 0h8"/><path class="muted-strike" d="m2 2 20 20"/></svg></button><span id="voice-mic-label">Зажми и говори</span></div>
<button id="voice-minimize" aria-label="Свернуть"></button>
</div>
<details id="conversation"><summary id="conversation-summary">Разговор</summary><div class="conversation-content"><div id="voice-task" hidden></div><div id="voice-transcript"></div></div></details>
</section>
<script src="i18n.js"></script><script src="render.js"></script><script src="speech-policy.js"></script><script src="voice.js"></script><script src="call-ui.js"></script>
</body></html>
