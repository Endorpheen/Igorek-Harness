<text x="70" y="1334" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Наблюдение не отправляет команд и не останавливает поручение.</text>
<text x="70" y="1382" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#334155">Снимок с отметкой времени; устаревшие и неполные данные обозначены.</text>
<text x="70" y="1422" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#334155">Автоматически: вопросы, готовые сообщения и итог. Действия — по запросу.</text>
<text x="70" y="1472" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#334155">Новых элементов UI нет. Ручной OpenCode и вкладки ChatGPT — как раньше.</text>
<text x="70" y="1512" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#334155">Модель не придумывает этапы, проценты или результаты проверок.</text>
<text x="55" y="1600" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#334155">Схема потока · ограничения платформ — в документации релиза.</text>
