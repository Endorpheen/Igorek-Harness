 .side-body { font-size:15px; fill:#536c61; }
 .body { font-size:16px; fill:#536c61; }
 .client-body { font-size:14px; fill:#536c61; }
 .small { font-size:12px; fill:#60786e; }
 .badge { font-size:12px; font-weight:700; fill:#34755f; }
 .connection { fill:none; stroke:#85a096; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
 .policy { fill:none; stroke:#85a096; stroke-width:1.6; stroke-dasharray:4 5; stroke-linecap:round; }
 .icon { fill:none; stroke:#34755f; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
</style>
