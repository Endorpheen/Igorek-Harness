<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="990" viewBox="0 0 1280 990" role="img" aria-labelledby="diagram-title diagram-description" xml:lang="ru">
<title id="diagram-title">Архитектура Игорька</title>
<desc id="diagram-description">Desktop, Web UI и Android связаны с общими сессиями и очередью задач. CLI и Telegram выбирают маршрут по профилю; ACP вызывает исполнитель агента напрямую. Исполнители профилей обращаются к моделям, инструментам, скиллам и MCP. Vault предоставляет разрешённый доступ; задачи выполняются на хосте или в опциональном Linux KVM. Панели ChatGPT и рабочие области OpenCode имеют отдельные сессии.</desc>
<defs>
 <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 7 3.5 0 7Z" fill="#65897d"/></marker>
</defs>
<style>
 text { font-family: 'DejaVu Sans', Arial, sans-serif; fill:#183a32; }
 .title { font-size:32px; font-weight:700; letter-spacing:-.6px; }
