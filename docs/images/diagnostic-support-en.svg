<text x="550" y="386" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Codes, events, identifiers</text>
<text x="550" y="413" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">No raw conversation or credentials</text>
<rect x="995" y="310" width="380" height="126" rx="18" fill="#263e30" stroke="#3c5847" stroke-width="2"/>
<text x="1015" y="349" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#bfee78">Copy diagnostics</text>
