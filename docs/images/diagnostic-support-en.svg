<polygon points="830,1303 818.5914266954252,1309.2325320018547 818.5914266954252,1296.7674679981453" fill="#a7d76b"/>
<text x="65" y="1458" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#f0f7ef">Opening the email app or sharesheet does not confirm delivery.</text>
<text x="65" y="1513" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#d5e4da">No SMTP credentials, upload service or background report sending.</text>
<text x="65" y="1562" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#d5e4da">Task execution, sandboxing and connection recovery retain their rules.</text>
