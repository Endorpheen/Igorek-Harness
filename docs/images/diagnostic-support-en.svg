<text x="65" y="664" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#bfee78">AFTER · 0.2.14</text>
<rect x="65" y="725" width="380" height="126" rx="18" fill="#263e30" stroke="#3c5847" stroke-width="2"/>
<text x="85" y="764" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#bfee78">User action</text>
<text x="85" y="801" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">In the existing notification</text>
<text x="85" y="828" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">center or diagnostics view</text>
