<text x="550" y="1041" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Save JSON, open email draft</text>
<text x="550" y="1068" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Attach the saved file manually</text>
