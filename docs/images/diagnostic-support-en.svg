<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1740" viewBox="0 0 1440 1740" role="img"><title>Igorek Harness · Voluntary diagnostics · en</title><rect width="1440" height="1740" fill="#101b17"/>
<text x="55" y="56" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#a7d76b">IGOREK HARNESS</text>
<text x="55" y="120" font-family="DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#f0f7ef">Voluntary diagnostic reports</text>
<text x="55" y="169" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" fill="#d5e4da">0.2.14 · Desktop / Web / Android</text>
