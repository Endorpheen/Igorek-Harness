<text x="550" y="801" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Allowlisted fields · up to 512 KiB</text>
<text x="550" y="828" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Frozen snapshot and report ID</text>
