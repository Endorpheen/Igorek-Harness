<text x="1015" y="764" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#bfee78">Review</text>
<text x="1015" y="801" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Recipient and file contents</text>
<text x="1015" y="827" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#d5e4da">The user decides whether to proceed</text>
