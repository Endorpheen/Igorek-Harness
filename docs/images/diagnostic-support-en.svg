<text x="1015" y="1004" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#bfee78">Android</text>
<text x="1015" y="1041" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">File and system sharesheet</text>
<text x="1015" y="1068" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Temporary FileProvider read grant</text>
