<polygon points="995,372 983.5914266954252,378.2325320018546 983.5914266954252,365.7674679981454" fill="#a7d76b"/>
<text x="65" y="502" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" fill="#d5e4da">Observations, retry attempts and separate outages are easy to confuse.</text>
<text x="65" y="550" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" fill="#d5e4da">An uncertain write outcome requires a separate admission check.</text>
<rect x="35" y="655" width="1370" height="875" rx="18" fill="#1e3027" stroke="#3c5847" stroke-width="2"/>
<text x="65" y="710" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#bfee78">AFTER · Shared contract, local ownership</text>
<rect x="530" y="754" width="380" height="124" rx="18" fill="#263e30" stroke="#3c5847" stroke-width="2"/>
<text x="550" y="793" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#bfee78">Shared catalogue</text>
<text x="550" y="830" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Codes · categories · actions</text>
<text x="550" y="857" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Python + generated JS / Kotlin</text>
<rect x="65" y="946" width="380" height="124" rx="18" fill="#263e30" stroke="#3c5847" stroke-width="2"/>
<text x="85" y="985" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#bfee78">Error observation</text>
<text x="85" y="1022" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Code · phase · profile / model</text>
<text x="85" y="1049" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Request / operation / task IDs</text>
<rect x="530" y="946" width="380" height="124" rx="18" fill="#263e30" stroke="#3c5847" stroke-width="2"/>
<text x="550" y="985" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#bfee78">Local incident journal</text>
<text x="550" y="1022" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Incident ≠ attempt ≠ outage</text>
<text x="550" y="1049" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">100 incidents · 8 recent events</text>
<rect x="995" y="946" width="380" height="124" rx="18" fill="#263e30" stroke="#3c5847" stroke-width="2"/>
<text x="1015" y="985" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#bfee78">Existing UI</text>
<text x="1015" y="1022" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">State and safe snapshot</text>
<text x="1015" y="1049" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Acknowledged ≠ recovered</text>
<polyline points="720,878 720,946" fill="none" stroke="#a7d76b" stroke-width="3"/>
<polygon points="720,946 713.7674679981453,934.5914266954252 726.2325320018547,934.5914266954252" fill="#a7d76b"/>
