<polygon points="995,1008 983.5914266954252,1014.2325320018547 983.5914266954252,1001.7674679981453" fill="#a7d76b"/>
<rect x="65" y="1160" width="380" height="124" rx="18" fill="#263e30" stroke="#3c5847" stroke-width="2"/>
<text x="85" y="1199" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#bfee78">Connection owner</text>
<text x="85" y="1236" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Retries: budget and backoff</text>
<text x="85" y="1263" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Stable readiness of its own path</text>
<rect x="530" y="1160" width="380" height="124" rx="18" fill="#263e30" stroke="#3c5847" stroke-width="2"/>
<text x="550" y="1199" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#bfee78">Unknown write outcome</text>
<text x="550" y="1236" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Read receipt with the same key</text>
<text x="550" y="1263" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">No second message submission</text>
<rect x="995" y="1160" width="380" height="124" rx="18" fill="#263e30" stroke="#3c5847" stroke-width="2"/>
<text x="1015" y="1199" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#bfee78">Admission receipt</text>
<text x="1015" y="1236" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Accepted or still unknown</text>
<text x="1015" y="1263" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Accepted ≠ task completed</text>
<polyline points="255,1160 255,1110 720,1110 720,1070" fill="none" stroke="#a7d76b" stroke-width="3"/>
<polygon points="720,1070 726.2325320018547,1081.408573304575 713.7674679981453,1081.408573304575" fill="#a7d76b"/>
<polyline points="910,1222 995,1222" fill="none" stroke="#a7d76b" stroke-width="3"/>
<polygon points="995,1222 983.5914266954252,1228.2325320018547 983.5914266954252,1215.7674679981453" fill="#a7d76b"/>
<text x="65" y="1371" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#f0f7ef">No automatic model/key changes; the observer never stops tasks.</text>
<text x="65" y="1421" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#d5e4da">Snapshots: allowlisted metadata; no prompts, secrets or tool arguments.</text>
<text x="65" y="1469" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#d5e4da">Sandboxing, owner approvals and project execution retain their rules.</text>
<text x="55" y="1595" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#91ad9b">RU / EN · Editable SVG and PNG · Synthetic tests ≠ physical acceptance</text>
</svg>
