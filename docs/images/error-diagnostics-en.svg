<text x="85" y="349" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#bfee78">Transport and model</text>
<text x="85" y="386" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Some errors already typed</text>
<text x="85" y="413" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Separate retry mechanisms</text>
<rect x="530" y="310" width="380" height="124" rx="18" fill="#263e30" stroke="#3c5847" stroke-width="2"/>
<text x="550" y="349" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#bfee78">Component boundaries</text>
<text x="550" y="386" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Some diagnostic fields lost</text>
<text x="550" y="413" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Different message grouping</text>
<rect x="995" y="310" width="380" height="124" rx="18" fill="#263e30" stroke="#3c5847" stroke-width="2"/>
<text x="1015" y="349" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#bfee78">Notifications</text>
<text x="1015" y="386" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Text and repeat count</text>
<text x="1015" y="413" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#d5e4da">Inconsistent recovery meaning</text>
<polyline points="445,372 530,372" fill="none" stroke="#a7d76b" stroke-width="3"/>
<polygon points="530,372 518.5914266954252,378.2325320018546 518.5914266954252,365.7674679981454" fill="#a7d76b"/>
