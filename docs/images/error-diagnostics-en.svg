<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1660" viewBox="0 0 1440 1660" role="img"><title>Igorek Harness · Error diagnostics · en</title><rect width="1440" height="1660" fill="#101b17"/>
<text x="55" y="56" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#a7d76b">IGOREK HARNESS</text>
<text x="55" y="124" font-family="DejaVu Sans,sans-serif" font-size="42" font-weight="700" fill="#f0f7ef">Error diagnostics</text>
<text x="55" y="171" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" fill="#d5e4da">Desktop · Web · Android · Python runtime</text>
<rect x="35" y="215" width="1370" height="405" rx="18" fill="#1e3027" stroke="#3c5847" stroke-width="2"/>
<text x="65" y="269" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#e6c481">BEFORE · Separate error contracts</text>
