<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="990" viewBox="0 0 1280 990" role="img" aria-labelledby="diagram-title diagram-description" xml:lang="en">
<title id="diagram-title">Igorek architecture</title>
<desc id="diagram-description">Desktop, Web UI and Android use shared sessions and a task queue. CLI and Telegram use profile-dependent routes; ACP enters agent execution directly. Profile workers use models, tools and skills or MCP. Vault supplies authorized access; execution uses a host workspace or optional Linux KVM. ChatGPT browser panels and OpenCode workspaces have separate sessions.</desc>
<defs>
 <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 7 3.5 0 7Z" fill="#65897d"/></marker>
</defs>
