<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc"><title id="title">Было: запуск в двух терминалах</title><desc id="desc">Пользователь отдельно запускает runtime и отдельно открывает чат.</desc><defs><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#bbed74"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#78c9dd"/></marker></defs><rect width="1280" height="960" fill="#0b1211"/><g font-family="DejaVu Sans, sans-serif"><text x="48" y="51" font-size="15" fill="#bbed74" font-weight="600">ИГОРЁК / CLI · АРХИТЕКТУРА</text><text x="1180" y="51" font-size="18" fill="#a1b8aa" font-weight="400">01</text><text x="48" y="107" font-size="35" fill="#edf4ed" font-weight="700">Было: запуск в двух терминалах</text><text x="48" y="144" font-size="17" fill="#a1b8aa" font-weight="400">Пользователь отдельно запускает runtime и отдельно открывает чат.</text><rect x="48" y="188" width="872" height="595" rx="25" fill="#101a16" stroke="#293b30"/><text x="74" y="224" font-size="15" fill="#e8b77d" font-weight="700">CLI · РУЧНОЕ УПРАВЛЕНИЕ</text><rect x="74" y="250" width="395" height="145" rx="18" fill="#13201c" stroke="#31483e"/><rect x="92" y="272" width="4" height="24" rx="2" fill="#e8b77d"/><text x="109" y="292" font-size="21" fill="#e8b77d" font-weight="600">Терминал 1</text><text x="96" y="326" font-size="16" fill="#a1b8aa" font-weight="400">igorek-factory run --profile P</text><text x="96" y="351" font-size="16" fill="#a1b8aa" font-weight="400">API + worker профиля P</text><rect x="499" y="250" width="395" height="145" rx="18" fill="#13201c" stroke="#31483e"/><rect x="517" y="272" width="4" height="24" rx="2" fill="#e8b77d"/><text x="534" y="292" font-size="21" fill="#e8b77d" font-weight="600">Терминал 2</text><text x="521" y="326" font-size="16" fill="#a1b8aa" font-weight="400">igorek-factory chat --profile P</text><text x="521" y="351" font-size="16" fill="#a1b8aa" font-weight="400">Интерфейс и история чата</text><polygon points="270.75,395.0 273.25,395.0 273.25,446.0 270.75,446.0" fill="#bbed74"/><polygon points="272,457 267.0,446.0 277.0,446.0" fill="#bbed74"/><polygon points="694.75,395.0 697.25,395.0 697.25,446.0 694.75,446.0" fill="#bbed74"/><polygon points="696,457 691.0,446.0 701.0,446.0" fill="#bbed74"/><rect x="191" y="457" width="586" height="135" rx="18" fill="#13201c" stroke="#31483e"/><rect x="209" y="479" width="4" height="24" rx="2" fill="#bbed74"/><text x="226" y="499" font-size="21" fill="#bbed74" font-weight="600">Очередь CLI · SQLite</text><text x="213" y="533" font-size="16" fill="#a1b8aa" font-weight="400">Чат создаёт задачу; worker исполняет её.</text><text x="213" y="558" font-size="16" fill="#a1b8aa" font-weight="400">Оба запуска должны выбрать нужный профиль.</text><rect x="74" y="634" width="820" height="110" rx="18" fill="#13201c" stroke="#31483e"/><rect x="92" y="656" width="4" height="24" rx="2" fill="#e8b77d"/><text x="109" y="676" font-size="21" fill="#e8b77d" font-weight="600">Завершение и профиль</text><text x="96" y="710" font-size="16" fill="#a1b8aa" font-weight="400">Ctrl+C закрывает тот запуск, в терминале которого он нажат.</text><text x="96" y="735" font-size="16" fill="#a1b8aa" font-weight="400">/profile показывал новое имя, но фактически не менял маршрут.</text><rect x="950" y="188" width="282" height="595" rx="25" fill="#101b19" stroke="#29443d"/><text x="974" y="224" font-size="15" fill="#78c9dd" font-weight="700">ДЕСКТОП</text><rect x="974" y="248" width="234" height="120" rx="18" fill="#13201c" stroke="#31483e"/><rect x="992" y="270" width="4" height="24" rx="2" fill="#78c9dd"/><text x="1009" y="290" font-size="21" fill="#78c9dd" font-weight="600">Electron</text><text x="996" y="324" font-size="16" fill="#a1b8aa" font-weight="400">Своё окно и сеансы</text><polygon points="1089.75,368.0 1092.25,368.0 1092.25,392.0 1089.75,392.0" fill="#78c9dd"/><polygon points="1091,403 1086.0,392.0 1096.0,392.0" fill="#78c9dd"/><rect x="974" y="403" width="234" height="145" rx="18" fill="#13201c" stroke="#31483e"/><rect x="992" y="425" width="4" height="24" rx="2" fill="#78c9dd"/><text x="1009" y="445" font-size="21" fill="#78c9dd" font-weight="600">Owned runtime</text><text x="996" y="479" font-size="16" fill="#a1b8aa" font-weight="400">Свои профили и Vault</text><text x="996" y="504" font-size="16" fill="#a1b8aa" font-weight="400">Своя очередь задач</text><polygon points="1089.75,548.0 1092.25,548.0 1092.25,572.0 1089.75,572.0" fill="#78c9dd"/><polygon points="1091,583 1086.0,572.0 1096.0,572.0" fill="#78c9dd"/><rect x="974" y="583" width="234" height="153" rx="18" fill="#13201c" stroke="#31483e"/><rect x="992" y="605" width="4" height="24" rx="2" fill="#78c9dd"/><text x="1009" y="625" font-size="21" fill="#78c9dd" font-weight="600">Worker</text><text x="996" y="659" font-size="16" fill="#a1b8aa" font-weight="400">Штатный жизненный</text><text x="996" y="684" font-size="16" fill="#a1b8aa" font-weight="400">цикл приложения</text><rect x="48" y="815" width="1184" height="120" rx="18" fill="#13201c" stroke="#31483e"/><rect x="66" y="837" width="4" height="24" rx="2" fill="#78c9dd"/><text x="83" y="857" font-size="21" fill="#78c9dd" font-weight="600">Что уже разделено</text><text x="70" y="891" font-size="16" fill="#a1b8aa" font-weight="400">У десктопа собственное хранилище и процессы. Это разделение сохраняется.</text></g></svg>