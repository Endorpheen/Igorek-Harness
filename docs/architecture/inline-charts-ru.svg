<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570"><rect width="1100" height="570" fill="#111719"/><text x="35" y="55" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#e9f1ed">Графики в чате: путь данных</text><rect x="30" y="95" width="1040" height="130" rx="14" fill="#1c2729" stroke="#45605a"/><rect x="30" y="250" width="1040" height="240" rx="14" fill="#1c2729" stroke="#45605a"/><text x="52" y="133" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#c4f26c">Раньше</text><text x="52" y="172" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#e9f1ed">Модель → обычный текстовый ответ</text><text x="52" y="206" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#aabbb3">Встроенной карточки графика в чате нет</text><text x="52" y="286" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#c4f26c">Теперь</text><text x="52" y="325" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#e9f1ed">Модель → render_chart → проверка чисел</text><text x="52" y="370" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#e9f1ed">Данные хранятся в обычной истории инструмента</text><text x="52" y="415" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#e9f1ed">Десктоп: SVG     Android: нативная карточка</text><text x="52" y="465" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#e9f1ed">Одни данные: версии, таблица и CSV</text><text x="35" y="540" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#aabbb3">Сервер модели и разрешения инструментов не меняются.</text></svg>