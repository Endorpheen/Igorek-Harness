<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570"><rect width="1100" height="570" fill="#111719"/><text x="35" y="55" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#e9f1ed">Inline charts: data flow</text><rect x="30" y="95" width="1040" height="130" rx="14" fill="#1c2729" stroke="#45605a"/><rect x="30" y="250" width="1040" height="240" rx="14" fill="#1c2729" stroke="#45605a"/><text x="52" y="133" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#c4f26c">Before</text><text x="52" y="172" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#e9f1ed">Model → ordinary text answer</text><text x="52" y="206" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#aabbb3">No native chart card in the conversation</text><text x="52" y="286" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#c4f26c">After</text><text x="52" y="325" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#e9f1ed">Model → render_chart → validate numbers</text><text x="52" y="370" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#e9f1ed">Stored tool input + compact result metadata</text><text x="52" y="415" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#e9f1ed">Desktop: SVG card     Android: native card</text><text x="52" y="465" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#e9f1ed">One stored dataset; update history, data and CSV</text><text x="35" y="540" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#aabbb3">The model server and existing tool permissions stay unchanged.</text></svg>