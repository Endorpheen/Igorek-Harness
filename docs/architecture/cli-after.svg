<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc"><title id="title">Стало: igorek и явный фоновый режим</title><desc id="desc">Чат и исполнитель разделены; владелец runtime определяет его время жизни.</desc><defs><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#bbed74"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#78c9dd"/></marker></defs><rect width="1280" height="960" fill="#0b1211"/><g font-family="DejaVu Sans, sans-serif"><text x="48" y="51" font-size="15" fill="#bbed74" font-weight="600">ИГОРЁК / CLI · АРХИТЕКТУРА</text><text x="1180" y="51" font-size="18" fill="#a1b8aa" font-weight="400">02</text><text x="48" y="107" font-size="35" fill="#edf4ed" font-weight="700">Стало: igorek и явный фоновый режим</text><text x="48" y="144" font-size="17" fill="#a1b8aa" font-weight="400">Чат и исполнитель разделены; владелец runtime определяет его время жизни.</text><rect x="48" y="188" width="872" height="595" rx="25" fill="#101a16" stroke="#385231"/><text x="74" y="224" font-size="15" fill="#bbed74" font-weight="700">CLI · ВЫБОР РЕЖИМА ПРИ ЗАПУСКЕ</text><rect x="74" y="250" width="395" height="120" rx="18" fill="#13201c" stroke="#31483e"/><rect x="92" y="272" width="4" height="24" rx="2" fill="#bbed74"/><text x="109" y="292" font-size="21" fill="#bbed74" font-weight="600">Обычный запуск · igorek</text><text x="96" y="326" font-size="16" fill="#a1b8aa" font-weight="400">Отдельный чат и выбранный профиль</text><rect x="499" y="250" width="395" height="120" rx="18" fill="#13201c" stroke="#31483e"/><rect x="517" y="272" width="4" height="24" rx="2" fill="#78c9dd"/><text x="534" y="292" font-size="21" fill="#78c9dd" font-weight="600">igorek → запущенный демон</text><text x="521" y="326" font-size="16" fill="#a1b8aa" font-weight="400">Фон включается отдельной командой</text><polygon points="270.75,370.0 273.25,370.0 273.25,402.0 270.75,402.0" fill="#bbed74"/><polygon points="272,413 267.0,402.0 277.0,402.0" fill="#bbed74"/><polygon points="694.75,370.0 697.25,370.0 697.25,402.0 694.75,402.0" fill="#78c9dd"/><polygon points="696,413 691.0,402.0 701.0,402.0" fill="#78c9dd"/><rect x="74" y="413" width="395" height="211" rx="18" fill="#13201c" stroke="#31483e"/><rect x="92" y="435" width="4" height="24" rx="2" fill="#bbed74"/><text x="109" y="455" font-size="21" fill="#bbed74" font-weight="600">SessionRuntime · клиенты</text><text x="96" y="489" font-size="16" fill="#a1b8aa" font-weight="400">Блокировки ОС считают живые чаты.</text><text x="96" y="514" font-size="16" fill="#a1b8aa" font-weight="400">Один worker для очереди + профиля.</text><text x="96" y="539" font-size="16" fill="#a1b8aa" font-weight="400">Последний чат выходит —</text><text x="96" y="564" font-size="16" fill="#a1b8aa" font-weight="400">CLI освобождает свой worker.</text><rect x="499" y="413" width="395" height="211" rx="18" fill="#13201c" stroke="#31483e"/><rect x="517" y="435" width="4" height="24" rx="2" fill="#78c9dd"/><text x="534" y="455" font-size="21" fill="#78c9dd" font-weight="600">app-server daemon start</text><text x="521" y="489" font-size="16" fill="#a1b8aa" font-weight="400">Worker + Scheduler + Watchdog.</text><text x="521" y="514" font-size="16" fill="#a1b8aa" font-weight="400">Выход из чата не завершает демон.</text><text x="521" y="539" font-size="16" fill="#a1b8aa" font-weight="400">stop отказывается прервать задачу.</text><text x="521" y="564" font-size="16" fill="#a1b8aa" font-weight="400">Автообновления не запускаются.</text><polygon points="270.75,624.0 273.25,624.0 273.25,650.0 270.75,650.0" fill="#bbed74"/><polygon points="272,661 267.0,650.0 277.0,650.0" fill="#bbed74"/><polygon points="694.75,624.0 697.25,624.0 697.25,650.0 694.75,650.0" fill="#78c9dd"/><polygon points="696,661 691.0,650.0 701.0,650.0" fill="#78c9dd"/><rect x="74" y="661" width="820" height="100" rx="18" fill="#13201c" stroke="#31483e"/><rect x="92" y="683" width="4" height="24" rx="2" fill="#bbed74"/><text x="109" y="703" font-size="21" fill="#bbed74" font-weight="600">Существующая очередь SQLite → executor</text><text x="96" y="737" font-size="16" fill="#a1b8aa" font-weight="400">Одинаковый профиль + data home: общая очередь; другой профиль: свой worker.</text><rect x="950" y="188" width="282" height="595" rx="25" fill="#101b19" stroke="#29443d"/><text x="974" y="224" font-size="15" fill="#78c9dd" font-weight="700">ДЕСКТОП</text><rect x="974" y="248" width="234" height="120" rx="18" fill="#13201c" stroke="#31483e"/><rect x="992" y="270" width="4" height="24" rx="2" fill="#78c9dd"/><text x="1009" y="290" font-size="21" fill="#78c9dd" font-weight="600">Electron</text><text x="996" y="324" font-size="16" fill="#a1b8aa" font-weight="400">Своё окно и сеансы</text><polygon points="1089.75,368.0 1092.25,368.0 1092.25,392.0 1089.75,392.0" fill="#78c9dd"/><polygon points="1091,403 1086.0,392.0 1096.0,392.0" fill="#78c9dd"/><rect x="974" y="403" width="234" height="145" rx="18" fill="#13201c" stroke="#31483e"/><rect x="992" y="425" width="4" height="24" rx="2" fill="#78c9dd"/><text x="1009" y="445" font-size="21" fill="#78c9dd" font-weight="600">Owned runtime</text><text x="996" y="479" font-size="16" fill="#a1b8aa" font-weight="400">Свои профили и Vault</text><text x="996" y="504" font-size="16" fill="#a1b8aa" font-weight="400">Своя очередь задач</text><polygon points="1089.75,548.0 1092.25,548.0 1092.25,572.0 1089.75,572.0" fill="#78c9dd"/><polygon points="1091,583 1086.0,572.0 1096.0,572.0" fill="#78c9dd"/><rect x="974" y="583" width="234" height="153" rx="18" fill="#13201c" stroke="#31483e"/><rect x="992" y="605" width="4" height="24" rx="2" fill="#78c9dd"/><text x="1009" y="625" font-size="21" fill="#78c9dd" font-weight="600">Worker</text><text x="996" y="659" font-size="16" fill="#a1b8aa" font-weight="400">Штатный жизненный</text><text x="996" y="684" font-size="16" fill="#a1b8aa" font-weight="400">цикл приложения</text><rect x="48" y="815" width="1184" height="120" rx="18" fill="#13201c" stroke="#31483e"/><rect x="66" y="837" width="4" height="24" rx="2" fill="#78c9dd"/><text x="83" y="857" font-size="21" fill="#78c9dd" font-weight="600">Ctrl+C закрывает этот чат и отменяет только его текущую задачу</text><text x="70" y="891" font-size="16" fill="#a1b8aa" font-weight="400">Другие CLI-клиенты и десктоп продолжают работать. В фоне расписания живут без терминала.</text><text x="70" y="916" font-size="16" fill="#a1b8aa" font-weight="400">/profile меняет реальный маршрут. Данные и права десктопа не копируются в CLI.</text></g></svg>