<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc"><title id="title">Read: доступ к полному результату</title><desc id="desc">Было: Read мог отклонить сохранённый результат вне рабочей папки; большой прочитанный результат мог сохраняться повторно. Стало: неизменяемый архив и запись о выдаче разрешают доступ в границах задачи или чата; текст выдаётся порциями с точным продолжением.</desc><defs><marker id="lime" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bde774"/></marker><marker id="muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#87958e"/></marker></defs><rect width="1600" height="1160" fill="#0c1311"/><g font-family="DejaVu Sans, sans-serif">
