<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc"><title id="title">Read: a reliable path to full tool output</title><desc id="desc">Before: an archived tool result outside the project could be rejected by Read, and large readable results could be archived again. After: immutable storage and an issuance record authorize scoped recovery; bounded pages include exact continuation.</desc><defs><marker id="lime" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bde774"/></marker><marker id="muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#87958e"/></marker></defs><rect width="1600" height="1160" fill="#0c1311"/><g font-family="DejaVu Sans, sans-serif">
