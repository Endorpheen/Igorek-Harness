name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets / current tree and history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified secret detector
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' > "$RUNNER_TEMP/checksum"
          (cd "$RUNNER_TEMP" && sha256sum --check checksum)
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Check files and all fetched history without exposing values
        run: |
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --config .gitleaks.toml .
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml --log-opts=--all .
  python:
    name: Python ${{ matrix.python }} / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.0'
      - name: Install system test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor bubblewrap qemu-utils ripgrep openssl xvfb python3-gi gir1.2-gtk-4.0
          if [ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] && \
             [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
              'profile igorek-ci-bwrap /usr/bin/bwrap flags=(unconfined) { userns, }' \
              | sudo tee /etc/apparmor.d/igorek-ci-bwrap > /dev/null
            sudo apparmor_parser -r /etc/apparmor.d/igorek-ci-bwrap
          fi
      - name: Install locked development environment
        run: uv sync --locked --dev --python '${{ matrix.python }}'
      - name: Check executable Python errors
        run: uv run --no-sync ruff check --select E9,F63,F7,F82 factory desktop tests tools
      - name: Run all Python test files with isolated data
        run: xvfb-run -a uv run --no-sync python -u tools/run_tests.py --jobs 4 --coverage --output test-results/python
      - name: Keep test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ matrix.python }}-reports
          path: |
            test-results/python/summary.json
            test-results/python/coverage.xml
            test-results/python/coverage.json
            test-results/python/*/results.xml
          if-no-files-found: warn
          retention-days: 7

  desktop:
    name: Desktop contracts / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop test

  native-linux:
    name: Native Linux / first task and restart
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install native prerequisites and locked dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor bubblewrap ripgrep openssl xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1
          uv sync --locked --dev
          npm --prefix desktop ci
      - name: Build and verify the actual offline snapshot
        run: |
          uv run --no-sync python desktop/packaging/build-runtime.py --output "$RUNNER_TEMP/igorek-native-runtime"
          uv run --no-sync python desktop/packaging/package-linux.py \
            --runtime "$RUNNER_TEMP/igorek-native-runtime" --output "$RUNNER_TEMP/igorek-native-snapshot"
      - name: Allow the packaged Electron to create its sandbox namespaces
        run: |
          if [ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] && \
             [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
            sudo bash desktop/packaging/install-sandbox-policy.sh --policy-name igorek-desktop-portable \
              --electron-binary "$RUNNER_TEMP/igorek-native-snapshot/igorek-desktop/electron/electron"
          fi
      - name: Exercise native UI, real backend and a synthetic provider
        run: |
          mkdir -p test-results/native-linux
          IGOREK_TEST_RUNTIME="$RUNNER_TEMP/igorek-native-snapshot/igorek-desktop/app/runtime" \
          IGOREK_TEST_OUTPUT="$PWD/test-results/native-linux" \
            xvfb-run -a "$RUNNER_TEMP/igorek-native-snapshot/igorek-desktop/electron/electron" \
              desktop/tests/native/first-run.cjs
          IGOREK_TEST_OUTPUT="$PWD/test-results/composer-linux" \
            xvfb-run -a "$RUNNER_TEMP/igorek-native-snapshot/igorek-desktop/electron/electron" \
              desktop/tests/native/composer-profiles.cjs
          IGOREK_TEST_RUNTIME="$RUNNER_TEMP/igorek-native-snapshot/igorek-desktop/app/runtime" \
          IGOREK_TEST_OUTPUT="$PWD/test-results/search-linux" \
            xvfb-run -a "$RUNNER_TEMP/igorek-native-snapshot/igorek-desktop/electron/electron" \
              desktop/tests/native/search-settings.cjs
          uv run --no-sync python desktop/packaging/check-native-report.py test-results/search-linux --search
      - name: Keep the sanitized acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-acceptance
          path: |
            test-results/native-linux/summary.json
            test-results/composer-linux/summary.json
            test-results/search-linux/summary.json
          if-no-files-found: warn
          retention-days: 7

  android:
    name: Android unit, lint and debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Gradle wrapper against its checksum
        working-directory: android
        run: |
          echo '3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          ./gradlew --no-daemon --version
      - name: Install the required Android compile SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Test and build without release signing credentials
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify the local context card on a disposable Android device
        timeout-minutes: 10
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/igorek-context-android
        run: |
          set -euo pipefail
          mkdir -p test-results/android-context
          test -c /dev/kvm
          sudo chown "$USER" /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-34;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force \
            --name igorek-context --package 'system-images;android-34;google_apis;x86_64' --device pixel_4
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          "$ANDROID_HOME/emulator/emulator" -avd igorek-context -port 5554 -accel on \
            -gpu swiftshader_indirect -no-window -no-audio -no-snapshot -no-boot-anim \
            -memory 2560 -cores 2 > test-results/android-context/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          adb="$ANDROID_HOME/platform-tools/adb"
          ready=false
          for attempt in $(seq 1 150); do
            if [ "$("$adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          (cd android && ./gradlew --no-daemon -PigorekTestRunner=ru.igorek.remote.ContextUsageInstrumentation assembleDebug assembleDebugAndroidTest)
          python3 - <<'PYSIGN'
          import hashlib, os, re, ssl, subprocess
          from pathlib import Path
          signer = Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0/apksigner'
          def fingerprint(path):
              result = subprocess.check_output([str(signer), 'verify', '--print-certs', '--print-certs-pem', path], text=True)
              certificate = re.search(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----', result, re.S)
              assert certificate is not None, result
              return hashlib.sha256(ssl.PEM_cert_to_DER_cert(certificate.group())).hexdigest()
          assert fingerprint('android/app/build/outputs/apk/debug/app-debug.apk') == fingerprint('android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk')
          PYSIGN
          "$adb" -s emulator-5554 install -r android/app/build/outputs/apk/debug/app-debug.apk
          "$adb" -s emulator-5554 install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          "$adb" -s emulator-5554 shell settings put system screen_off_timeout 1800000
          "$adb" -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
          "$adb" -s emulator-5554 shell wm dismiss-keyguard
          "$adb" -s emulator-5554 shell input keyevent 82
          "$adb" -s emulator-5554 shell am instrument -w \
            ru.igorek.remote.test/ru.igorek.remote.ContextUsageInstrumentation \
            > test-results/android-context/instrumentation.log
          "$adb" -s emulator-5554 pull /sdcard/Android/data/ru.igorek.remote/files/context-usage-qa test-results/android-context/ || true
          python3 - <<'PYTEST'
          from pathlib import Path
          text = Path('test-results/android-context/instrumentation.log').read_text()
          assert 'PASS context usage' in text, text
          PYTEST
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            android/app/build/test-results/**/*.xml
            android/app/build/reports/lint-results-debug.xml
            test-results/android-context/
          if-no-files-found: warn
          retention-days: 7

  source:
    name: Source and publication contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - run: uv sync --locked --dev
      - run: uv run --no-sync python tools/check_publication.py
      - run: uv run --no-sync python tools/build_wheel.py --output dist
