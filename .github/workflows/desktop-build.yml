name: Desktop packages

on:
  workflow_dispatch:
  pull_request:
    paths: ['factory/**', 'desktop/**', 'tests/test_platform_support.py', 'tests/test_vault_lifecycle.py', 'pyproject.toml', 'uv.lock', '.python-version', '.gitattributes', '.github/workflows/desktop-build.yml']
  push:
    branches: [main]
    paths: ['factory/**', 'desktop/**', 'pyproject.toml', 'uv.lock', '.python-version', '.gitattributes', '.github/workflows/desktop-build.yml']

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            flag: --linux
          - os: windows-2025
            target: windows-x64
            flag: --win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked dependencies
        run: |
          uv sync --locked --dev
          npm --prefix desktop ci
      - name: Run file and Vault contracts on the actual OS
        run: |
          uv run --no-sync python -m pytest tests/test_platform_support.py tests/test_vault_lifecycle.py tests/test_checkpoint_process.py tests/test_release_install.py -v \
            --cov=factory.core.platform_support --cov=factory.core.vault.lifecycle --cov-branch \
            --cov-report=json:test-results/platform-${{ runner.os }}-coverage.json --cov-report=term
      - name: Require canonical clean sources before packaging
        run: |
          uv run --no-sync python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from build_wheel import git_output
          status = git_output('status', '--porcelain')
          if status:
              print(status.decode('utf-8', errors='replace'), end='')
              raise SystemExit('Release source checkout is modified')
          PY
      - name: Build target Python payload
        run: |
          if [ '${{ matrix.target }}' = windows-x64 ]; then
            uv run --no-sync python desktop/packaging/build-windows-runtime.py --output "$RUNNER_TEMP/igorek-runtime"
          else
            uv run --no-sync python desktop/packaging/build-runtime.py --output "$RUNNER_TEMP/igorek-runtime"
          fi
      - name: Stage reviewed application files
        run: |
          uv run --no-sync python desktop/packaging/stage-app.py --runtime "$RUNNER_TEMP/igorek-runtime" \
            --output "$RUNNER_TEMP/igorek-app" --target '${{ matrix.target }}'
      - name: Package without publishing
        working-directory: desktop
        env:
          IGOREK_DESKTOP_APP_DIR: ${{ runner.temp }}/igorek-app
          IGOREK_DESKTOP_DIST_DIR: ${{ runner.temp }}/igorek-dist
        run: npx --no-install electron-builder --config electron-builder.cjs ${{ matrix.flag }} --x64 --publish never
      - name: Preserve the Linux snapshot installer in the DEB candidate
        if: runner.os == 'Linux'
        run: |
          uv run --no-sync python desktop/packaging/package-linux.py --runtime "$RUNNER_TEMP/igorek-runtime" \
            --output "$RUNNER_TEMP/igorek-snapshot"
          version=$(uv run --no-sync python -c 'from importlib.metadata import version; print(version("igorek-agent-factory"))')
          uv run --no-sync python desktop/packaging/package-deb.py --snapshot "$RUNNER_TEMP/igorek-snapshot/igorek-desktop" \
            --output "$RUNNER_TEMP/igorek-dist/igorek-$version-linux-amd64.deb"
      - name: Windows installer and native first-task acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem "$env:RUNNER_TEMP/igorek-dist/igorek-*-win-x64.exe")
          if ($installer.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $install = Join-Path $env:RUNNER_TEMP 'igorek installed проверка'
          $process = Start-Process -FilePath $installer[0].FullName -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          $env:IGOREK_TEST_RUNTIME = Join-Path $install 'resources/app/runtime'
          $env:IGOREK_TEST_OUTPUT = Join-Path $env:GITHUB_WORKSPACE 'test-results/native-windows'
          & ./desktop/node_modules/.bin/electron.cmd desktop/tests/native/first-run.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows acceptance failed' }
          & uv run --no-sync python desktop/packaging/check-native-report.py $env:IGOREK_TEST_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Native report is incomplete' }
          $env:IGOREK_TEST_PYTHON = Join-Path $env:GITHUB_WORKSPACE '.venv/Scripts/python.exe'
          $env:IGOREK_TEST_OUTPUT = Join-Path $env:GITHUB_WORKSPACE 'test-results/composer-windows'
          & ./desktop/node_modules/.bin/electron.cmd desktop/tests/native/composer-profiles.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native composer profile acceptance failed' }
          $env:IGOREK_TEST_OUTPUT = Join-Path $env:GITHUB_WORKSPACE 'test-results/search-windows'
          & ./desktop/node_modules/.bin/electron.cmd desktop/tests/native/search-settings.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native search settings acceptance failed' }
          & uv run --no-sync python desktop/packaging/check-native-report.py $env:IGOREK_TEST_OUTPUT --search
          if ($LASTEXITCODE -ne 0) { throw 'Native search report is incomplete' }
          $process = Start-Process -FilePath $installer[0].FullName -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Reinstallation failed' }
          $env:IGOREK_UPDATE_INSTALL = $install
          $env:IGOREK_UPDATE_SOURCE = $installer[0].FullName
          @'
          import ctypes, hashlib, json, os, shutil, subprocess, sys, time
          from pathlib import Path
          target = Path(os.environ['IGOREK_UPDATE_INSTALL']).resolve()
          root = Path(os.environ['RUNNER_TEMP']).resolve() / 'igorek-self-update/release-downloads/release-fixture'
          root.mkdir(parents=True)
          version = json.loads((target / 'resources/app/source-manifest.json').read_text())['version']
          asset = root / f'igorek-{version}-win-x64.exe'
          shutil.copyfile(os.environ['IGOREK_UPDATE_SOURCE'], asset)
          runtime = target / 'resources/app/runtime'
          python = runtime / json.loads((runtime / 'manifest.json').read_text())['python']
          copied = root / 'helper-python'
          shutil.copytree(python.parent, copied)
          script = root / 'apply-update.py'
          shutil.copyfile('desktop/release-install.py', script)
          canary = root.parent.parent / 'user-data/connection.fixture'
          canary.parent.mkdir(); canary.write_bytes(b'keep-synthetic-connection')
          parent = subprocess.Popen([sys.executable, '-c', 'pass']); parent.wait(timeout=5)
          request = root / 'install-request.json'
          request.write_text(json.dumps({'schema':1,'kind':'windows','file':str(asset),'size':asset.stat().st_size,
              'sha256':hashlib.file_digest(asset.open('rb'),'sha256').hexdigest(),'version':version,
              'target':str(target),'parent_pid':parent.pid,'restart':False,'data_dir':str(canary.parent)}), encoding='utf-8')
          result = subprocess.run([str(copied / python.name), '-I', '-B', str(script), str(request)], timeout=240)
          assert result.returncode == 0
          assert json.loads(request.with_suffix('.result.json').read_text())['state'] == 'installed'
          assert canary.read_bytes() == b'keep-synthetic-connection'
          launched = subprocess.Popen([str(target / 'igorek.exe'), '--data-dir', str(canary.parent)],
              stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          try:
              certificate = canary.parent / 'web-ui/tls/localhost-cert.pem'
              deadline = time.monotonic() + 40
              while not certificate.is_file() and launched.poll() is None and time.monotonic() < deadline:
                  time.sleep(0.1)
              assert certificate.is_file() and launched.poll() is None, 'Packaged relaunch did not retain its data directory'
              user = ctypes.WinDLL('user32')
              user.GetWindowThreadProcessId.argtypes = [ctypes.c_void_p, ctypes.POINTER(ctypes.c_ulong)]
              user.PostMessageW.argtypes = [ctypes.c_void_p, ctypes.c_uint, ctypes.c_size_t, ctypes.c_ssize_t]
              callback_type = ctypes.WINFUNCTYPE(ctypes.c_bool, ctypes.c_void_p, ctypes.c_ssize_t)
              user.IsWindowVisible.argtypes = [ctypes.c_void_p]
              def owned_windows():
                  windows = []
                  def collect(handle, _):
                      identity = ctypes.c_ulong()
                      user.GetWindowThreadProcessId(handle, ctypes.byref(identity))
                      if identity.value == launched.pid and user.IsWindowVisible(handle):
                          windows.append(handle)
                      return True
                  user.EnumWindows(callback_type(collect), 0)
                  return windows
              deadline = time.monotonic() + 20
              while len(owned_windows()) < 2 and launched.poll() is None and time.monotonic() < deadline:
                  time.sleep(0.1)
              windows = owned_windows()
              assert len(windows) >= 2, 'Main and first-run owner windows did not become visible'
              for handle in windows:
                  user.PostMessageW(handle, 0x0010, 0, 0)
              deadline = time.monotonic() + 20
              while launched.poll() is None and time.monotonic() < deadline:
                  for handle in owned_windows():
                      user.PostMessageW(handle, 0x0010, 0, 0)
                  time.sleep(0.1)
              assert launched.poll() == 0, 'Packaged desktop did not close gracefully'
          finally:
              if launched.poll() is None:
                  subprocess.run(['taskkill', '/PID', str(launched.pid), '/T', '/F'], check=False,
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          assert canary.read_bytes() == b'keep-synthetic-connection'
          print('Verified updater installed the Windows candidate with spaces/Unicode and retained synthetic data')
          '@ | & uv run --no-sync python -
          if ($LASTEXITCODE -ne 0) { throw 'Automatic update acceptance failed' }
          $uninstaller = Get-ChildItem $install -Filter '*Uninstall*.exe'
          if (@($uninstaller).Count -ne 1) { throw 'Uninstaller is missing' }
          $process = Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Uninstaller failed' }
      - name: Diagnose a failed native Windows tour with synthetic thread stacks
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:IGOREK_DIAG_RUNTIME = Join-Path $env:RUNNER_TEMP 'igorek-diagnostic-runtime'
          $env:IGOREK_TEST_OUTPUT = Join-Path $env:GITHUB_WORKSPACE 'test-results/native-windows-diagnostics'
          @'
          import json, os, shutil
          from pathlib import Path
          source = Path(os.environ['RUNNER_TEMP']) / 'igorek installed проверка/resources/app/runtime'
          destination = Path(os.environ['IGOREK_DIAG_RUNTIME'])
          if not source.is_dir():
              raise SystemExit('No installed runtime is available for diagnosis')
          shutil.copytree(source, destination)
          output = Path(os.environ['IGOREK_TEST_OUTPUT'])
          output.mkdir(parents=True, exist_ok=True)
          stacks = json.dumps((output / 'thread-stacks.log').as_posix())
          wrapper = ('import faulthandler, runpy\nfrom pathlib import Path\n'
                     f'log=open({stacks}, "w", encoding="utf-8")\n'
                     'faulthandler.dump_traceback_later(20, repeat=True, file=log)\n'
                     'runpy.run_path(str(Path(__file__).with_name("backend.py")), run_name="__main__")\n')
          (destination / 'diagnostic-entry.py').write_text(wrapper, encoding='utf-8')
          manifest = destination / 'manifest.json'
          value = json.loads(manifest.read_text())
          value['entry'] = 'diagnostic-entry.py'
          manifest.write_text(json.dumps(value), encoding='utf-8')
          '@ | & uv run --no-sync python -
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic fixture preparation failed' }
          $env:IGOREK_TEST_RUNTIME = $env:IGOREK_DIAG_RUNTIME
          & ./desktop/node_modules/.bin/electron.cmd desktop/tests/native/first-run.cjs
          Write-Output 'Diagnostic clone result is separate from native package acceptance.'
      - name: Keep candidate packages and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: igorek-${{ matrix.target }}-candidate
          path: |
            ${{ runner.temp }}/igorek-dist/*.exe
            ${{ runner.temp }}/igorek-dist/*.deb
            ${{ runner.temp }}/igorek-dist/*.AppImage
            test-results/native-windows/summary.json
            test-results/composer-windows/summary.json
            test-results/native-windows-diagnostics/summary.json
            test-results/native-windows-diagnostics/thread-stacks.log
            test-results/platform-*-coverage.json
          if-no-files-found: warn
          retention-days: 7
