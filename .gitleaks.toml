title = "Igorek secret detection"

[extend]
useDefault = true

[[allowlists]]
description = "Historical synthetic Tavily smoke fixture; never a provider credential"
condition = "AND"
paths = ['(^|/)factory/core/smoke_vault\.py$']
regexTarget = "secret"
regexes = ['^tvly-secret-[0-9]{20}$']

[[allowlists]]
description = "Boolean UI state assignment mistaken for a generic credential"
condition = "AND"
paths = ['(^|/)desktop/owner-ui\.js$']
regexTarget = "match"
regexes = ['mobileAccessEnabled=reply\.result\.enabled===true;']

[[allowlists]]
description = "Bundled xterm export assignment; upstream code contains no credential"
condition = "AND"
paths = ['(^|/)(factory/web_ui/static/vendor|android/app/src/main/assets/terminal)/xterm\.js$']
regexTarget = "match"
regexes = ['t\.FourKeyMap=t\.TwoKeyMap=void ']

[[allowlists]]
description = "Synthetic receipt-fixture idempotency key; not an authorization credential"
condition = "AND"
paths = ['(^|/)desktop/tests/error-diagnostics\.test\.cjs$', '(^|/)tests/test_mobile_bridge_server\.py$']
regexTarget = "secret"
regexes = ['^fixture-operation-123$']
